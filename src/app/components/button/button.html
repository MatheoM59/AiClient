<button
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="ariaLabel()"
  (click)="clicked.emit()"
  class="grid cursor-pointer place-items-center text-sm font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-50"
  [class]="classes()"
>
  {{ text() }}
</button>
